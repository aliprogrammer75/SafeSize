name: SafeSize dedicated account and real push QA
on:
  workflow_dispatch:
  push:
    branches: [unified-web-mobile]
    paths: ['integration/account_qa_trigger.txt']
permissions:
  contents: read
concurrency:
  group: safesize-dedicated-account-qa
  cancel-in-progress: false
jobs:
  qa:
    if: github.ref == 'refs/heads/unified-web-mobile' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-account-qa]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Require a dedicated account secret
        env:
          SAFESIZE_QA_PASSWORD: ${{ secrets.SAFESIZE_QA_PASSWORD }}
        run: |
          test -n "$SAFESIZE_QA_PASSWORD" || { echo 'Configure the dedicated subscriber secret first; never use a personal or admin password.'; exit 1; }
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install isolated QA clients
        run: |
          python3 -m venv "$RUNNER_TEMP/account-qa"
          "$RUNNER_TEMP/account-qa/bin/pip" install --disable-pip-version-check websocket-client==1.8.0 playwright==1.51.0
          "$RUNNER_TEMP/account-qa/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/account-qa/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/account-qa/bin/python" -m py_compile integration/account_qa.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Independent desktop and Android account QA
        env:
          SAFESIZE_QA_PASSWORD: ${{ secrets.SAFESIZE_QA_PASSWORD }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 integration/account_qa.py
      - name: Upload sanitized QA report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safesize-dedicated-account-qa
          path: account-qa-output/report.json
          retention-days: 7
          if-no-files-found: warn
