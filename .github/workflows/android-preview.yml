name: Android preview build
on:
  push:
    branches: [ui-bitunix-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Prepare installed Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-34/android.jar" || ! -x "$SDK/build-tools/34.0.0/aapt2" ]]; then
            MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$MANAGER" ]]; then
              MANAGER=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
            fi
            test -x "$MANAGER"
            "$MANAGER" --sdk_root="$SDK" 'platforms;android-34' 'build-tools;34.0.0'
          fi
          test -f "$SDK/platforms/android-34/android.jar"
          test -x "$SDK/build-tools/34.0.0/aapt2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bundle pinned open-source chart engine
        run: bash scripts/prepare-chart.sh
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SafeSize-preview-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
